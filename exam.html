<title>امتحان تاريخ الأردن</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F6F1E7;
    --surface:#FFFFFF;
    --surface-2:#FBF8F2;
    --ink:#2A241D;
    --ink-soft:#79705F;
    --line:#E4D9C5;
    --line-strong:#D2C3A4;
    --header-bg:#7C2A34;
    --header-bg-2:#5E2029;
    --header-ink:#FBF3E6;
    --accent:#8C2F39;
    --accent-soft:#F1E1C8;
    --gold:#A97F2E;
    --gold-soft:#F1E4C4;
    --success:#3F7857;
    --success-bg:#E4EFE6;
    --error:#B23A32;
    --error-bg:#F6E3DE;
    --shadow: 0 1px 2px rgba(42,36,29,.06), 0 8px 24px -12px rgba(42,36,29,.18);
  }
  @media (prefers-color-scheme: dark){

      --paper:#1A1510;
      --surface:#241E17;
      --surface-2:#2B241B;
      --ink:#ECE2D0;
      --ink-soft:#B3A48D;
      --line:#3B3225;
      --line-strong:#4A3F2E;
      --header-bg:#3E1A20;
      --header-bg-2:#2A1216;
      --header-ink:#F3E4C9;
      --accent:#E29AA0;
      --accent-soft:#3A2A22;
      --gold:#D8B36B;
      --gold-soft:#3A2F1C;
      --success:#8FCBA6;
      --success-bg:#20342A;
      --error:#E2948A;
      --error-bg:#3A231F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1A1510;
    --surface:#241E17;
    --surface-2:#2B241B;
    --ink:#ECE2D0;
    --ink-soft:#B3A48D;
    --line:#3B3225;
    --line-strong:#4A3F2E;
    --header-bg:#3E1A20;
    --header-bg-2:#2A1216;
    --header-ink:#F3E4C9;
    --accent:#E29AA0;
    --accent-soft:#3A2A22;
    --gold:#D8B36B;
    --gold-soft:#3A2F1C;
    --success:#8FCBA6;
    --success-bg:#20342A;
    --error:#E2948A;
    --error-bg:#3A231F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Cairo","Tahoma",sans-serif;
    direction:rtl;
    padding-inline:16px;
    padding-block:28px;
  }
  h1,h2,h3,.display{
    font-family:"Amiri","Traditional Arabic",serif;
    text-wrap:balance;
  }
  .wrap{
    max-width:920px;
    margin-inline:auto;
  }

  /* ---------- Header ---------- */
  .masthead{
    position:relative;
    background:linear-gradient(155deg,var(--header-bg),var(--header-bg-2));
    color:var(--header-ink);
    border-radius:18px;
    padding:22px 24px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .masthead::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 12% 120%, rgba(255,255,255,.08), transparent 55%),
      radial-gradient(circle at 100% -10%, rgba(255,255,255,.10), transparent 45%);
    pointer-events:none;
  }
  .seal{
    flex:none;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .seal svg{width:30px;height:30px;display:block;}
  .masthead-text{position:relative;flex:1;min-width:220px;}
  .eyebrow{
    font-size:.72rem;
    letter-spacing:.14em;
    color:var(--gold-soft);
    text-transform:uppercase;
    font-weight:600;
    display:block;
    margin-bottom:2px;
  }
  .masthead h1{
    margin:0;
    font-size:clamp(1.3rem,3.2vw,1.75rem);
    font-weight:700;
    color:var(--header-ink);
  }
  .masthead p{
    margin:.3em 0 0;
    color:rgba(251,243,230,.78);
    font-size:.9rem;
  }
  .progress-chip{
    position:relative;
    flex:none;
    background:rgba(0,0,0,.18);
    border-radius:999px;
    padding:8px 16px;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:.95rem;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    margin-top:14px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--accent));
    border-radius:999px;
    transition:width .35s ease;
  }

  /* ---------- Layout ---------- */
  .board{
    display:flex;
    gap:20px;
    margin-top:20px;
    align-items:flex-start;
  }
  .main-panel{flex:1;min-width:0;}
  .side-panel{
    width:230px;
    flex:none;
    position:sticky;
    top:20px;
  }
  @media (max-width:760px){
    .board{flex-direction:column;}
    .side-panel{width:100%;position:static;}
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:26px;
  }
  .card + .card{margin-top:18px;}
  .card h2{margin:0 0 4px;font-size:1.15rem;}
  .card .card-hint{margin:0 0 16px;color:var(--ink-soft);font-size:.86rem;}

  /* ---------- Setup screen ---------- */
  .lesson-list{display:flex;flex-direction:column;gap:10px;}
  .lesson-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--surface-2);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .lesson-row:hover{border-color:var(--line-strong);}
  .lesson-row.checked{background:var(--accent-soft);border-color:var(--accent);}
  .lesson-check{
    flex:none;
    width:24px;height:24px;
    border-radius:7px;
    border:2px solid var(--ink-soft);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
  }
  .lesson-row.checked .lesson-check{background:var(--accent);border-color:var(--accent);}
  .lesson-check svg{width:14px;height:14px;display:none;}
  .lesson-row.checked .lesson-check svg{display:block;}
  .lesson-info{flex:1;min-width:0;}
  .lesson-info b{display:block;font-size:1rem;}
  .lesson-info span{display:block;font-size:.82rem;color:var(--ink-soft);margin-top:2px;}
  .lesson-count{
    flex:none;
    font-size:.76rem;
    font-weight:700;
    color:var(--gold);
    background:var(--gold-soft);
    border-radius:999px;
    padding:4px 12px;
    font-variant-numeric:tabular-nums;
  }

  .count-readout{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:12px;
    font-variant-numeric:tabular-nums;
  }
  .count-readout b{font-family:"Amiri",serif;font-size:1.9rem;color:var(--accent);}
  .count-readout span{color:var(--ink-soft);font-size:.9rem;}
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
    height:6px;
  }
  .presets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .preset-btn{
    font-family:"Cairo",sans-serif;
    font-size:.8rem;
    font-weight:600;
    border:1px solid var(--line-strong);
    background:var(--surface-2);
    color:var(--ink);
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
  }
  .preset-btn.active{background:var(--accent);border-color:var(--accent);color:var(--header-ink);}
  .setup-warn{font-size:.82rem;color:var(--error);margin:12px 0 0;}
  .start-row{margin-top:20px;}

  /* ---------- Question card ---------- */
  .q-lesson-tag{
    display:inline-block;
    font-size:.72rem;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:999px;
    padding:3px 11px;
    margin-bottom:12px;
  }
  .q-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:2.4em;height:2.4em;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:"Amiri",serif;
    font-weight:700;
    font-size:1.15rem;
    flex:none;
  }
  .q-head{display:flex;align-items:flex-start;gap:14px;}
  .q-text{
    font-size:1.12rem;
    line-height:1.9;
    margin:0;
    padding-top:.2em;
  }
  .q-text mark{
    background:transparent;
    color:var(--accent);
    font-weight:700;
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-underline-offset:3px;
  }

  .options{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:right;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    font-family:"Cairo",sans-serif;
    font-size:1rem;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover{border-color:var(--line-strong);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .bubble{
    flex:none;
    width:2.1em;height:2.1em;
    border-radius:50%;
    border:2px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:"Amiri",serif;
    font-weight:700;
    font-size:1rem;
    color:var(--ink-soft);
    background:var(--surface);
    transition:all .15s ease;
  }
  .opt.selected{background:var(--accent-soft);border-color:var(--accent);}
  .opt.selected .bubble{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .opt.correct{background:var(--success-bg);border-color:var(--success);}
  .opt.correct .bubble{background:var(--success);border-color:var(--success);color:var(--surface);}
  .opt.incorrect{background:var(--error-bg);border-color:var(--error);}
  .opt.incorrect .bubble{background:var(--error);border-color:var(--error);color:var(--surface);}
  .opt[disabled]{cursor:default;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
  }
  .btn{
    font-family:"Cairo",sans-serif;
    font-weight:600;
    font-size:.95rem;
    border-radius:10px;
    padding:11px 18px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:var(--surface-2);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--header-ink);}
  .btn-primary:hover{background:var(--header-bg-2);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#2A2210;}

  /* ---------- Side palette ---------- */
  .palette-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
  }
  .palette-title{
    font-size:.82rem;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:.02em;
    margin:0 0 12px;
  }
  .palette-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
  }
  @media (max-width:760px){
    .palette-grid{grid-template-columns:repeat(10,1fr);}
  }
  .pnum{
    aspect-ratio:1;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink-soft);
    font-size:.74rem;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .pnum.answered{background:var(--gold-soft);border-color:var(--gold);color:var(--ink);}
  .pnum.current{outline:2px solid var(--accent);outline-offset:1px;}
  .pnum.correct{background:var(--success-bg);border-color:var(--success);color:var(--success);}
  .pnum.incorrect{background:var(--error-bg);border-color:var(--error);color:var(--error);}

  .legend{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:8px;}
  .dot{width:.8em;height:.8em;border-radius:3px;flex:none;border:1px solid var(--line);}
  .dot.answered{background:var(--gold-soft);border-color:var(--gold);}
  .dot.plain{background:var(--surface-2);}

  .submit-box{margin-top:16px;}
  .submit-warn{
    font-size:.8rem;
    color:var(--error);
    margin:0 0 10px;
    line-height:1.6;
  }

  /* ---------- Results ---------- */
  .results-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .ring-wrap{flex:none;position:relative;width:132px;height:132px;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-num{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Amiri",serif;
  }
  .ring-num b{font-size:1.7rem;line-height:1;color:var(--ink);}
  .ring-num small{font-size:.72rem;color:var(--ink-soft);}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:200px;}
  .stat{
    flex:1;min-width:110px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    text-align:center;
  }
  .stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;}
  .stat span{font-size:.76rem;color:var(--ink-soft);}
  .stat.success b{color:var(--success);}
  .stat.error b{color:var(--error);}

  .review-list{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .review-item{
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    background:var(--surface-2);
  }
  .review-item.correct{border-inline-start:4px solid var(--success);}
  .review-item.incorrect{border-inline-start:4px solid var(--error);}
  .review-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .review-head p{margin:0;font-weight:600;line-height:1.7;}
  .chip{
    flex:none;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;
  }
  .chip.correct{background:var(--success-bg);color:var(--success);}
  .chip.incorrect{background:var(--error-bg);color:var(--error);}
  .review-answers{margin-top:8px;font-size:.86rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;}
  .review-answers b{color:var(--ink);font-weight:600;}

  .retry-row{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap;}
</style>

  LESSON1.forEach(function(q){ q.lesson = "الدرس الأول"; });
  LESSON2.forEach(function(q){ q.lesson = "الدرس الثاني"; });
  LESSON3.forEach(function(q){ q.lesson = "الدرس الثالث"; });
  LESSON4.forEach(function(q){ q.lesson = "الدرس الرابع"; });
  LESSON5.forEach(function(q){ q.lesson = "الوحدة 2 - الدرس الأول"; });
  LESSON6.forEach(function(q){ q.lesson = "الوحدة 2 - الدرس الثاني"; });

  var LESSONS = [
    {id:"l1", title:"الدرس الأول", subtitle:"الأردن في العصور الحجرية", questions:LESSON1},
    {id:"l2", title:"الدرس الثاني", subtitle:"الأردن في العصر الحديدي", questions:LESSON2},
    {id:"l3", title:"الدرس الثالث", subtitle:"مملكة الأنباط", questions:LESSON3},
    {id:"l4", title:"الدرس الرابع", subtitle:"الحضارتان اليونانية والرومانية-البيزنطية", questions:LESSON4},
    {id:"l5", title:"الوحدة 2 - الدرس الأول", subtitle:"الأردنّ في صدر الإسلام", questions:LESSON5},
    {id:"l6", title:"الوحدة 2 - الدرس الثاني", subtitle:"الأردنّ في العصر الأموي", questions:LESSON6}
  ];

  function freshState(){
    return {
      screen:"setup",
      selected:{l1:true, l2:true, l3:true, l4:true, l5:true, l6:true},
      lockToAll:true,
      count:null,
      pool:[],
      title:"",
      current:0,
      answers:[],
      submitted:false,
      confirmArmed:false
    };
  }
  var state = freshState();

  // ---- restore across redeploys for viewers with the page already open ----
  try{
    if (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.v===1){
      state = window.claude.hot.data.state;
    }
  }catch(e){}

  function snapshot(){
    try{
      if (window.claude && window.claude.hot && window.claude.hot.snapshot){
        window.claude.hot.snapshot(function(){ return {v:1, state:state}; });
      }
    }catch(e){}
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function formatQ(text){
    var safe = escapeHtml(text);
    return safe.replace(/§(.+?)§/g, "<mark>$1</mark>");
  }

  var app = document.getElementById("app");

  function sealSVG(){
    return '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M10 30 L20 12 L28 12 L38 30 L30 30 L24 18 L18 30 Z" fill="currentColor" opacity=".9"/>'+
      '<rect x="14" y="32" width="20" height="4" rx="1.5" fill="currentColor" opacity=".6"/>'+
      '</svg>';
  }
  function checkSVG(){
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function selectedPoolSize(){
    var n = 0;
    LESSONS.forEach(function(L){ if (state.selected[L.id]) n += L.questions.length; });
    return n;
  }

  function shuffled(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function startExam(){
    var pool = [];
    LESSONS.forEach(function(L){ if (state.selected[L.id]) pool = pool.concat(L.questions); });
    pool = shuffled(pool);
    var n = Math.min(state.count || pool.length, pool.length);
    pool = pool.slice(0, n);

    var names = LESSONS.filter(function(L){ return state.selected[L.id]; }).map(function(L){ return L.title; });
    state.pool = pool;
    state.title = names.join(" + ");
    state.current = 0;
    state.answers = new Array(pool.length).fill(null);
    state.submitted = false;
    state.confirmArmed = false;
    state.screen = "exam";
  }

  function render(){
    var html = '';

    if (state.screen === "setup"){
      var poolSize = selectedPoolSize();
      if (state.lockToAll || state.count===null || state.count>poolSize) state.count = poolSize;
      var anySelected = poolSize > 0;

      html += '<header class="masthead">' +
        '<div class="seal" style="color:var(--gold)">'+sealSVG()+'</div>' +
        '<div class="masthead-text">' +
          '<span class="eyebrow">امتحان تدريبي إلكتروني</span>' +
          '<h1>تاريخ الأردن</h1>' +
          '<p>اختاري الدرس أو الدروس، وحدّدي عدد الأسئلة، ثمّ ابدئي</p>' +
        '</div>' +
      '</header>';

      html += '<div class="card">';
      html += '<h2>الدروس</h2><p class="card-hint">يمكن اختيار درس واحد أو أكثر معًا.</p>';
      html += '<div class="lesson-list">';
      LESSONS.forEach(function(L){
        var checked = !!state.selected[L.id];
        html += '<label class="lesson-row'+(checked?' checked':'')+'" data-lesson="'+L.id+'">' +
          '<span class="lesson-check">'+checkSVG()+'</span>' +
          '<span class="lesson-info"><b>'+L.title+'</b><span>'+L.subtitle+'</span></span>' +
          '<span class="lesson-count">'+L.questions.length+' سؤال</span>' +
        '</label>';
      });
      html += '</div></div>';

      html += '<div class="card">';
      html += '<h2>عدد أسئلة الامتحان</h2>';
      html += '<div class="count-readout"><b>'+state.count+'</b><span>سؤالًا من أصل '+poolSize+' متاحًا</span></div>';
      html += '<input type="range" id="countSlider" min="'+(poolSize?Math.min(5,poolSize):0)+'" max="'+(poolSize||1)+'" value="'+state.count+'" '+(poolSize?'':'disabled')+'>';
      html += '<div class="presets">';
      [10,20,30].forEach(function(n){
        if (n<=poolSize){
          html += '<button type="button" class="preset-btn'+(!state.lockToAll && state.count===n?' active':'')+'" data-preset="'+n+'">'+n+'</button>';
        }
      });
      html += '<button type="button" class="preset-btn'+(state.lockToAll?' active':'')+'" data-preset="all">الكل ('+poolSize+')</button>';
      html += '</div>';
      if (!anySelected) html += '<p class="setup-warn">اختاري درسًا واحدًا على الأقلّ للبدء.</p>';
      html += '<div class="start-row"><button type="button" class="btn btn-gold" id="startBtn" style="width:100%" '+(anySelected?'':'disabled')+'>ابدأ الامتحان</button></div>';
      html += '</div>';

      app.innerHTML = html;
      wireSetupEvents();
      snapshot();
      return;
    }

    var TOTAL = state.pool.length;
    var answeredCount = state.answers.filter(function(a){return a!==null;}).length;
    var pct = TOTAL ? Math.round((answeredCount/TOTAL)*100) : 0;

    html += '<header class="masthead">' +
      '<div class="seal" style="color:var(--gold)">'+sealSVG()+'</div>' +
      '<div class="masthead-text">' +
        '<span class="eyebrow">امتحان تدريبي إلكتروني</span>' +
        '<h1>تاريخ الأردن</h1>' +
        '<p>'+escapeHtml(state.title)+' — '+TOTAL+' سؤالًا، اختيار من متعدد</p>' +
      '</div>' +
      (!state.submitted ?
        '<div class="progress-chip">السؤال '+(state.current+1)+' من '+TOTAL+'</div>'
        : '<div class="progress-chip">انتهى الامتحان</div>') +
    '</header>';

    if (!state.submitted){
      html += '<div class="progress-track" style="max-width:920px;margin-top:14px;">'+
        '<div class="progress-fill" style="width:'+pct+'%"></div></div>';
    }

    html += '<div class="board">';
    html += '<div class="main-panel">';

    if (!state.submitted){
      var qq = state.pool[state.current];
      html += '<div class="card">';
      html += '<span class="q-lesson-tag">'+escapeHtml(qq.lesson)+'</span>';
      html += '<div class="q-head"><span class="q-number">'+(state.current+1)+'</span>' +
               '<p class="q-text">'+formatQ(qq.q)+'</p></div>';
      html += '<ul class="options">';
      qq.o.forEach(function(opt, i){
        var sel = state.answers[state.current]===i;
        html += '<li>'+
          '<button type="button" class="opt'+(sel?' selected':'')+'" data-opt="'+i+'" aria-pressed="'+sel+'">'+
            '<span class="bubble">'+LETTERS[i]+'</span>' +
            '<span>'+escapeHtml(opt)+'</span>' +
          '</button>'+
        '</li>';
      });
      html += '</ul>';
      html += '<div class="nav-row">' +
        '<button type="button" class="btn" id="prevBtn" '+(state.current===0?'disabled':'')+'>السؤال السابق</button>' +
        '<button type="button" class="btn btn-primary" id="nextBtn" '+(state.current===TOTAL-1?'disabled':'')+'>السؤال التالي</button>' +
      '</div>';
      html += '</div>'; // card

      html += '<div class="submit-box">';
      if (state.confirmArmed && answeredCount < TOTAL){
        html += '<p class="submit-warn">لم تُجب عن '+(TOTAL-answeredCount)+' سؤالًا بعد. اضغط "تأكيد التسليم" للمتابعة رغم ذلك.</p>';
        html += '<button type="button" class="btn btn-gold" id="submitBtn" style="width:100%">تأكيد التسليم</button>';
      } else {
        html += '<button type="button" class="btn btn-gold" id="submitBtn" style="width:100%">تسليم الامتحان</button>';
      }
      html += '</div>';
    } else {
      // -------- results --------
      var correctCount = 0, wrongCount = 0, blankCount = 0;
      state.pool.forEach(function(qq, i){
        if (state.answers[i]===null) blankCount++;
        else if (state.answers[i]===qq.c) correctCount++;
        else wrongCount++;
      });
      var scorePct = TOTAL ? Math.round((correctCount/TOTAL)*100) : 0;
      var R = 54, C = 2*Math.PI*R;
      var dash = (scorePct/100)*C;

      html += '<div class="card">';
      html += '<h2 style="margin:0 0 16px;font-size:1.25rem;">نتيجتك</h2>';
      html += '<div class="results-top">';
      html += '<div class="ring-wrap"><svg viewBox="0 0 120 120">' +
        '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="10"/>' +
        '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--gold)" stroke-width="10" ' +
        'stroke-dasharray="'+dash+' '+C+'" stroke-linecap="round"/></svg>' +
        '<div class="ring-num"><b>'+scorePct+'%</b><small>'+correctCount+' من '+TOTAL+'</small></div></div>';
      html += '<div class="stat-row">' +
        '<div class="stat success"><b>'+correctCount+'</b><span>إجابات صحيحة</span></div>' +
        '<div class="stat error"><b>'+wrongCount+'</b><span>إجابات خاطئة</span></div>' +
        '<div class="stat"><b>'+blankCount+'</b><span>بدون إجابة</span></div>' +
      '</div></div>';

      html += '<div class="review-list">';
      state.pool.forEach(function(qq, i){
        var ua = state.answers[i];
        var isCorrect = ua === qq.c;
        html += '<div class="review-item '+(isCorrect?'correct':'incorrect')+'">';
        html += '<div class="review-head"><p>'+(i+1)+'. '+formatQ(qq.q)+'</p>' +
          '<span class="chip '+(isCorrect?'correct':'incorrect')+'">'+(isCorrect?'صحيح':'خطأ')+'</span></div>';
        if (!isCorrect){
          html += '<div class="review-answers">' +
            '<span>إجابتك: '+(ua===null?'لم تُجب':(LETTERS[ua]+') '+escapeHtml(qq.o[ua])))+'</span>' +
            '<span><b>الإجابة الصحيحة: '+LETTERS[qq.c]+') '+escapeHtml(qq.o[qq.c])+'</b></span>' +
          '</div>';
        }
        html += '</div>';
      });
      html += '</div>';

      html += '<div class="retry-row">' +
        '<button type="button" class="btn btn-primary" id="retryBtn">إعادة المحاولة</button>' +
        '<button type="button" class="btn" id="newExamBtn">امتحان جديد</button>' +
      '</div>';
    }

    html += '</div>'; // main-panel

    html += '<div class="side-panel"><div class="palette-card">' +
      '<p class="palette-title">خريطة الأسئلة</p>' +
      '<div class="palette-grid">';
    state.pool.forEach(function(qq, i){
      var cls = "pnum";
      if (!state.submitted){
        if (state.answers[i]!==null) cls += " answered";
        if (i===state.current) cls += " current";
      } else {
        cls += (state.answers[i]===qq.c) ? " correct" : " incorrect";
      }
      html += '<button type="button" class="'+cls+'" data-jump="'+i+'">'+(i+1)+'</button>';
    });
    html += '</div>';
    if (!state.submitted){
      html += '<div class="legend">' +
        '<span><i class="dot answered"></i> تمت الإجابة</span>' +
        '<span><i class="dot plain"></i> لم تتم الإجابة بعد</span>' +
      '</div>';
    } else {
      html += '<div class="legend">' +
        '<span><i class="dot" style="background:var(--success-bg);border-color:var(--success)"></i> صحيحة</span>' +
        '<span><i class="dot" style="background:var(--error-bg);border-color:var(--error)"></i> خاطئة</span>' +
      '</div>';
    }
    html += '</div></div>'; // palette-card, side-panel

    html += '</div>'; // board

    app.innerHTML = html;
    wireExamEvents();
    snapshot();
  }

  function wireSetupEvents(){
    app.querySelectorAll('.lesson-row').forEach(function(row){
      row.addEventListener('click', function(){
        var id = row.getAttribute('data-lesson');
        state.selected[id] = !state.selected[id];
        state.lockToAll = true;
        render();
      });
    });
    var slider = document.getElementById('countSlider');
    if (slider) slider.addEventListener('input', function(){
      state.lockToAll = false;
      state.count = parseInt(slider.value,10);
      render();
    });
    app.querySelectorAll('.preset-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var p = btn.getAttribute('data-preset');
        if (p === 'all'){ state.lockToAll = true; }
        else { state.lockToAll = false; state.count = parseInt(p,10); }
        render();
      });
    });
    var start = document.getElementById('startBtn');
    if (start) start.addEventListener('click', function(){
      startExam();
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  }

  function wireExamEvents(){
    var TOTAL = state.pool.length;
    app.querySelectorAll('.opt').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.answers[state.current] = parseInt(btn.getAttribute('data-opt'),10);
        state.confirmArmed = false;
        render();
      });
    });
    var prev = document.getElementById('prevBtn');
    if (prev) prev.addEventListener('click', function(){
      if (state.current>0){ state.current--; state.confirmArmed=false; render(); }
    });
    var next = document.getElementById('nextBtn');
    if (next) next.addEventListener('click', function(){
      if (state.current<TOTAL-1){ state.current++; state.confirmArmed=false; render(); }
    });
    var submit = document.getElementById('submitBtn');
    if (submit) submit.addEventListener('click', function(){
      var answeredCount = state.answers.filter(function(a){return a!==null;}).length;
      if (answeredCount < TOTAL && !state.confirmArmed){
        state.confirmArmed = true;
        render();
        return;
      }
      state.submitted = true;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    var retry = document.getElementById('retryBtn');
    if (retry) retry.addEventListener('click', function(){
      state.pool = shuffled(state.pool);
      state.current = 0;
      state.answers = new Array(state.pool.length).fill(null);
      state.submitted = false;
      state.confirmArmed = false;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    var newExam = document.getElementById('newExamBtn');
    if (newExam) newExam.addEventListener('click', function(){
      state.screen = 'setup';
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    app.querySelectorAll('.pnum').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (state.submitted) return;
        state.current = parseInt(btn.getAttribute('data-jump'),10);
        state.confirmArmed = false;
        render();
      });
    });
  }

  function boot(){ render(); }
  try{
    if (window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(boot);
    } else { boot(); }
  }catch(e){ boot(); }
})();
</script>

</body></html>
